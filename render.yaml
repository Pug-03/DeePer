# Render Blueprint. Starter plan with a persistent disk: the SQLite DB and
# every uploaded picture live under DATA_DIR on that disk, so a redeploy or
# restart keeps them (the free plan has no disk and wiped them every time).
services:
  - type: web
    name: deeper
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm --prefix server ci && npm --prefix client ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: deeper-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DATA_DIR
        value: /var/data
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: INVITE_CODE
        sync: false
      # Only the site itself may call the API from a browser (the iOS app
      # isn't a browser, so CORS doesn't apply to it).
      - key: CORS_ORIGIN
        value: https://deeper.in.th,https://www.deeper.in.th
