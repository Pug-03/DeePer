<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#120a0e" />
    <title>DeePer — การ์ดคำถามชวนคุยลึก ๆ</title>
    <meta name="description" content="การ์ดคำถามชวนคุยลึก ๆ สำหรับคู่รัก เพื่อน และครอบครัว ใช้ฟรี" />

    <!-- Link previews (LINE, Facebook, Messenger, IG DMs, X). Crawlers need
         absolute URLs, so these point at the production domain. The image
         is public/og-image.jpg (1200x630). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DeePer" />
    <meta property="og:locale" content="th_TH" />
    <meta property="og:url" content="https://deeper.in.th/" />
    <meta property="og:title" content="DeePer — การ์ดคำถามชวนคุยลึก ๆ" />
    <meta property="og:description" content="การ์ดคำถามชวนคุยลึก ๆ สำหรับคู่รัก เพื่อน และครอบครัว ใช้ฟรี" />
    <meta property="og:image" content="https://deeper.in.th/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DeePer การ์ดคำถามชวนคุยลึก ๆ สำหรับคู่รัก เพื่อน และครอบครัว" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA / เปิดแบบเต็มจอเมื่อเพิ่มลงหน้าจอโฮม (ไม่มีแถบเบราว์เซอร์) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DeePer" />
    <link rel="icon" href="/icon-512.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Digits only (text= subset): Noto Sans Thai is listed first in the font
         stack, so 0-9 render in Noto while every other character falls back to
         IBM Plex Sans Thai. Plex's numeral 1 read oddly at stat sizes. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&text=0123456789&display=swap"
      rel="stylesheet"
    />
  </head>

    <div id="root"></div>

  </body>
